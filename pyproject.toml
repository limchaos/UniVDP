[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "univdp"
version = "0.1.0"
description = "UniVDP: a full-reference quality metric for images and videos, SDR and HDR, at any frame rate, built on ColorVideoVDP and DINOv3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "torch>=2.1",
   "timm>=1.0.25",
   "numpy>=1.24",
   "scipy>=1.10",
   "opencv-python>=4.8",
   "cvvdp @ git+https://github.com/gfxdisp/ColorVideoVDP.git@v0.5.6",
]

[project.scripts]
univdp = "pyunivdp.run_univdp:main"

[tool.setuptools]
packages = ["pyunivdp"]

[tool.setuptools.package-data]
pyunivdp = ["vvdp_data/*.json"]
